# mTLS Zero-Trust lab stack — internal CA + service-b (mTLS server) + service-a (mTLS client).
#
# Working directory: 2-mtls-zero-trust-service-auth/1-java/.docker
#
# Launch: docker compose up -d --build
# Cleanup: docker compose down -v

name: 2-mtls-zero-trust-service-auth

services:
  cert-init:
    image: eclipse-temurin:21-alpine
    environment:
      STOREPASS: "changeit"
    volumes:
      - certs:/certs
      - ./gen-certs.sh:/gen-certs.sh:ro
    command: ["sh", "-c", "apk add --no-cache openssl >/dev/null 2>&1 && sh /gen-certs.sh"]

  service-b:
    build:
      context: ..
      dockerfile: Dockerfile.service-b
    environment:
      CERTS_DIR: "/certs"
      STOREPASS: "changeit"
    volumes:
      - certs:/certs:ro
    networks:
      - 2-mtls-zero-trust-service-auth
    depends_on:
      cert-init:
        condition: service_completed_successfully

  service-a:
    build:
      context: ..
      dockerfile: Dockerfile.service-a
    environment:
      CERTS_DIR: "/certs"
      STOREPASS: "changeit"
      SERVICE_B_HOST: "service-b"
      SERVICE_B_PORT: "8443"
    volumes:
      - certs:/certs:ro
    ports:
      - "3000:3000"
    networks:
      - 2-mtls-zero-trust-service-auth
    depends_on:
      cert-init:
        condition: service_completed_successfully
      service-b:
        condition: service_started

volumes:
  certs:

networks:
  2-mtls-zero-trust-service-auth:
    name: 2-mtls-zero-trust-service-auth
