# mTLS server config. client-auth=need => Tomcat requires a client certificate and
# verifies it against the truststore (the internal CA) during the TLS handshake.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${CERTS_DIR:/certs}/server.p12
server.ssl.key-store-password=${STOREPASS:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.trust-store=${CERTS_DIR:/certs}/truststore.p12
server.ssl.trust-store-password=${STOREPASS:changeit}
server.ssl.trust-store-type=PKCS12
server.ssl.client-auth=need
