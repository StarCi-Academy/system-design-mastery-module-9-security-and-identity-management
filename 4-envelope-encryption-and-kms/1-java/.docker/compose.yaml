# "Envelope encryption + KMS" lab stack (Java) — Vault Transit + PostgreSQL + Spring Boot app.
#
# Working directory: 4-envelope-encryption-and-kms/1-java/.docker
#
# Launch: docker compose up -d --build
# Cleanup: docker compose down -v

name: 4-envelope-encryption-and-kms-java

services:
  vault:
    image: hashicorp/vault:1.15
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - envelope-java

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    networks:
      - envelope-java
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vaultdb || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-service:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
      KEK_NAME: "app-kek"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "admin"
      DB_PASSWORD: "123456"
      DB_NAME: "vaultdb"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    networks:
      - envelope-java

networks:
  envelope-java:
    name: envelope-java
