# "Tamper-evident audit logging" lab stack (Java) — PostgreSQL + Spring Boot hash-chain API.
#
# Working directory: 5-tamper-evident-audit-logging/1-java/.docker
# Launch: docker compose up -d --build
# Cleanup: docker compose down -v

name: 5-tamper-evident-audit-logging-java

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auditdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    networks:
      - 5-tamper-evident-audit-logging-java
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auditdb || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  audit-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "admin"
      DB_PASSWORD: "123456"
      DB_NAME: "auditdb"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - 5-tamper-evident-audit-logging-java

networks:
  5-tamper-evident-audit-logging-java:
    name: 5-tamper-evident-audit-logging-java
