# "API Edge Security — WAF" lab stack: a WAF gateway in front of a backend echo service.
#
# Working directory: 6-api-edge-security-waf/0-typescript/.docker
#
# Launch:   docker compose up -d --build
# Cleanup:  docker compose down -v
#
# Contract (identical across all four language tracks):
#   POST /api/echo  clean   -> 200 {"status":"allowed","echo":{...}}
#   POST /api/echo  malicious-> 403 {"status":"blocked","rule":"sql_injection|xss|ssrf"}
#   GET  /healthz           -> 200 {"status":"ok"}

name: 6-api-edge-security-waf

services:
  # Backend echo service — only reachable through the gateway network; it trusts
  # that the WAF already filtered the traffic and simply reflects the payload.
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      PORT: "4000"
    networks:
      - 6-api-edge-security-waf

  # WAF gateway — the API edge. Every request passes the WAF middleware first;
  # clean traffic is proxied to the backend, malicious traffic is blocked 403.
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      BACKEND_URL: "http://backend:4000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - 6-api-edge-security-waf

networks:
  6-api-edge-security-waf:
    name: 6-api-edge-security-waf
